name: Frontend Icons Check

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-icons.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-icons.yml'

jobs:
  verify-icons:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync official SVG icons
        run: npm run icons:sync

      - name: Verify icon coverage
        run: npm run icons:verify
